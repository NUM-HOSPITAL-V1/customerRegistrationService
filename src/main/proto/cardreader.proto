syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc";
option java_outer_classname = "CardReaderProto";

service CardReaderService {
  rpc ReadCard (CardRequest) returns (CardResponse);
}

message CardRequest {
  bool include_image = 1;
}

message CardResponse {
  map<string, string> fields = 1;
}
