spring.application.name=userapi
server.port=${SERVER_PORT:8081}

hospital.security.publicKey=${HOSPITAL_PUBLIC_KEY:demo-public-key}
hospital.security.privateKey=${HOSPITAL_PRIVATE_KEY:demo-private-key}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Swagger ????????
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Auth
auht.url=${AUTH_SERVICE_URL:http://auth-service:8080}
